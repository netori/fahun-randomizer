# ── 随机化规则：任意类 → 任意类（M1 的唯一候选来源）─────────────────────────────
# 规则表按顺序求值，**第一条命中的规则生效**；没命中任何规则 = 保持原样（default_rate 兜底）。
# 每条规则：
#   id                     规则名（唯一；写进各位置的 reason 与界面开关）
#   match                  谁适用：cls（类名列表，空=所有类）/ pools（池名，命中任一即算）/
#                          area（base|dlc|any）/ tier（可选，1..4）
#   rate                   这条规则管的位置参与随机的百分比（0..1）；界面可逐类再覆盖
#   targets                候选来源：cls（类名列表，或 "all"）/ areas（same=同区域，或 any/[base,dlc]）/
#                          tier（可选，限定来源强度档）/ pools（可选，限定来源所属池）
#   size_max / size_max_height   可选：体型上限倍数（默认取 options.constraints 的 3.0）
#   clamp_hp / clamp_soul        可选：缩放系数上下限（默认 0.6–2.5）；跨类大跨度时按规则放宽
#
# 语义提醒：
#   · 池开关（keystone/remembrance/waygate/reliquary）在规则之前判定 —— 关掉池 = 该池位置保持原样，
#     不会因为它的类被某条规则覆盖又换掉。
#   · keep 的位置永远不会被换；它们也不会被当来源（include_keep_as_source: false），
#     所以多阶段 Boss（荷莱露/拉塔恩约定/梅瑟莫…）不会被丢进别的坑位。
#   · **难度怎么守恒**：hp 与魂用「位置原值」直接写进该位置的克隆 NpcParam 行（M2 为每个位置
#     复制一条新行），不是把换入者的值乘系数 —— 所以换进来的是谁都不影响这一格的强度。
#     换入者自己的血量只出现在 coef_hp（记录用）与观感里。
#   · 可选 hp_band（默认不写 = 不限）：只想从「强度相近」的敌人里抽时加一条，如 [0.5, 2.0]。
#     它只收窄候选、不参与难度计算；测试过 0.5–2.0 时三条主规则都还有候选（零空池）。
randomization:
  default_rate: 0.0

  # 捐赠者黑名单（模型级）：这些模型「能被换掉」，但不能被推进别人的位置。
  # 判据 = 它的战斗方式依赖自己的位置/脚本，换到别处会变成废人（不会攻击、原地传送、复制玩家）。
  donor_deny:
    - {model: c4140, reason: "唤灵蜗牛：本体不动，只靠召唤物作战"}
    - {model: c4480, reason: "「病花」米兰达：扎根不动，靠孢子和缠绕"}
    - {model: c1000, reason: "仿身泪滴：CopyPlayerCharacterData 复制玩家，换到普通位置只剩一具尸体壳"}
    - {model: c4950, reason: "提比亚的唤声船：传送是 AI goal 495000 + 地图事件配合的行为；换到别处会原地循环传送（改通用 AI 的尝试失败，见 ai_fallback）"}

  # 战斗 AI 兜底（实验性开关，当前为空）：给模型克隆 think 行、把 battleGoalID 换成通用 AI，
  # 用途是让「换到别处会变废人」的敌人至少能打。
  # 2026-10-21 实测（c4950 唤声船 → goal 11000）：换完**完全不动**，比原来的"原地循环传送"更糟。
  # 结论：换 AI goal 不是"去掉传送"，而是把整只怪换成另一套行为树，通用近战 goal 并不适配这类体型/模型。
  # → 已回退：c4950 挪回 donor_deny，这里清空。以后要重试别的模型，先在小范围加一条再验证。
  ai_fallback: []

  rules:
    # ⓪ 多阶段 Boss 整组替换（v1.1，实验性；默认关，界面勾「多阶段整体替换」才生效）
    #    不是逐位置抽：把一整组阶段当成一个单位，去换另一整组阶段
    #    （一阶段换一阶段、二阶段换二阶段），否则会出现「一阶段是 A、二阶段还是原 Boss」。
    #    只对 multiphase.groups 里 kind=phase 且 swap=true 的 5 组生效；
    #    targets 必须覆盖这些组的类（玛莲妮亚二阶段在参考表里是 Helper）。
    - id: multiphase_boss
      name: 多阶段 Boss 整组替换
      match: {multiphase: true}
      rate: 1.0
      targets: {cls: [Boss, Helper, MinorBoss, Miniboss, NightMiniboss, DragonMiniboss, Evergaol], areas: any}
      note: "整组互换：阶段数必须相同；有 pair 绑定的组不开（安塞尔河坏档的根因）"

    # ① 黄金树传送门守门位：一律按 Boss 抽（「传送门 boss 也是 boss」，用户 2026-10-20）
    - id: waygate_guardian
      name: 黄金树传送门守门
      match: {pools: [waygate]}
      rate: 1.0
      targets: {cls: [Boss, MinorBoss, Miniboss, NightMiniboss, DragonMiniboss], areas: same}
      note: "守门位只换 boss 级身份；换成杂兵会让「守门战」变成无害路人，奖励链仍在但观感全无"

    # ② 有 Boss 血条的位置：不管它在参考表里被标成什么类，一律按 Boss 抽
    #    （判据：位置表 bar=1，来自地图 EMEVD 的 DisplayBossHealthBar / 90005870 / 90005876 等模板调用）
    #    反例（修之前）：m18 的「猎犬骑士哥廷」参考类=Basic，被 fauna 换成了普通杂兵 —— 双 Boss 战变成单 Boss。
    - id: bossbar_position
      name: 有血条的位置按 Boss 抽
      match: {bar: true}
      rate: 1.0
      targets: {cls: [Boss, MinorBoss, Miniboss, NightMiniboss, DragonMiniboss, Evergaol], areas: same}
      note: "血条是位置给的（EMEVD），不是模型给的：这里换成杂兵 = 一场 Boss 战变成无害路人"

    # ③ Boss 六类互换成任意 Boss —— 你要的「某类 boss 随全种类 boss」
    - id: boss_any
      name: 全部 Boss 互换
      match: {cls: [Boss, MinorBoss, Miniboss, NightMiniboss, DragonMiniboss, Evergaol]}
      rate: 1.0
      targets: {cls: [Boss, MinorBoss, Miniboss, NightMiniboss, DragonMiniboss, Evergaol], areas: same}
      note: "具名 Boss 与各类小 Boss 同一池；换入后按位置原强度缩放（系数见 clamp）"

    # ④ 杂兵三族互换（普通怪 / 野兽 / 法魂无名杂兵）—— 玩家最常遇到的那一层
    - id: fauna
      name: 杂兵互换
      match: {cls: [Basic, Wildlife]}
      rate: 1.0
      targets: {cls: [Basic, Wildlife], areas: same}
      note: "野生生物几乎没有实体 ID 但同样能换（换的是身份层，不是脚本点名）；法魂无名杂兵已并入 Basic"

    # ⑤ 粪金龟 / 商队巨魔：2026-10-24 起不再随机（类别保留为内部标记，policy=keep）

# ── 覆盖层：人工改判（优先于所有自动规则）────────────────────────────────────
overrides:
  models: {}      # 例： c3300: {class: Basic, policy: randomize, note: "..."}
  places: []      # 例： {map: m60_45_37_10, part_name: c3650_9000, occurrence: 1, policy: keep, reason: "..."}

# ── 构建期断言（--check 会验；对不上就是数据/配置漂移）─────────────────────────
assertions:
  total_places: 27780
  # "同一物理位置的两份 MSB"（已封印/未封印成对）：M1 必须同步替换，否则同一地点两种状态看到两只不同的敌人
  linked_pairs: 2124
  linked_rows: 4248
  physical_positions: 25656
