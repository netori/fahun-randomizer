# ─────────────────────────────────────────────────────────────────────────────
# enemy_classes_v3.yaml —— 敌人分类与政策（v1 的单一权威源）
#
# 谁读它：只被离线构建器 investigation/apply/enemy_data_build.py 读（--build）。
#         运行期读的是 investigation/enemy_places.csv（由本文件 + MSB 扫描 + 参考基线合成）。
# 改它的流程：改本文件 → python investigation/apply/enemy_data_build.py --build → --check
# 设计来源：docs/敌人随机_分类与平衡_设计v0.md
# ─────────────────────────────────────────────────────────────────────────────
version: 3
updated: "2026-10-24"

meta:
  key: "(map, part_name, occurrence)"          # 位置主键；entity_id 有 69% 是 0，不能当键
  reference: "thefifthmatt SoulsRandomizers diste/Base/enemy.txt（Classes 块）"
  note: |
    L1 类名沿用参考实现的 14 个值。2026-10-24 起按作者要求收成两档：
      · 参与随机 / 界面上出现的 9 类：Basic Wildlife HostileNPC Boss MinorBoss
        Miniboss NightMiniboss DragonMiniboss Evergaol
      · 内部标记类（ui: false，不进界面、不参与随机、不当来源）：
        None / Helper / DupeOnly / Dummy / Scarab / CaravanTroll
    法魂新增的无名杂兵（旧 Mob 类）已并入 Basic（见 class_aliases）：它们的 silo/tier
    与普通杂兵同一套，不再单列一类。
    类名只做显示与 silo 第一维；真正的池边界是 silo（见 l2_silo）。

# ── L1：类别 ────────────────────────────────────────────────────────────────
# silo=true  → 参与随机，且按 (类 × 本体/DLC) 分 silo（候选集 = 同 silo 内）
# silo=false → 该类整体不参与随机（policy 兜底 keep）
l1_classes:
  # ── 参与随机、界面可见的 9 类 ──
  Basic:          {silo: true,  policy: randomize, note: "普通杂兵（人数最多的一类；含旧 Mob 法魂无名杂兵）"}
  Wildlife:       {silo: true,  policy: randomize, note: "野兽/野生生物；几乎都没有实体 ID"}
  HostileNPC:     {silo: true,  policy: randomize, note: "敌对 NPC（红灵/入侵者一类）"}
  MinorBoss:      {silo: true,  policy: randomize, note: "按 Boss 装配的小 Boss（有血条）"}
  Boss:           {silo: true,  policy: randomize, note: "具名 Boss"}
  Miniboss:       {silo: true,  policy: randomize}
  NightMiniboss:  {silo: true,  policy: randomize}
  DragonMiniboss: {silo: true,  policy: randomize}
  Evergaol:       {silo: true,  policy: randomize, note: "封印监牢"}
  # ── 内部标记类（ui: false）：只用来把「不能动」的位置分类，不参与随机、不当来源、不进界面 ──
  None:           {silo: false, policy: keep, ui: false, note: "参考基线标 None：占位空壳/剧情对象/拟态复制体等，没有可战斗的身份"}
  Helper:         {silo: false, policy: keep, ui: false, note: "跟随主人的 helper（召唤物/炮台/剧情随从）：单独换 = 与主人断链"}
  DupeOnly:       {silo: false, policy: keep, ui: false, note: "参考实现里只能被强制映射的「分身/复制品」实体"}
  Dummy:          {silo: false, policy: keep, ui: false, note: "训练假人/弹丸假人/危害物"}
  Scarab:         {silo: false, policy: keep, ui: false, note: "粪金龟：只是掉落容器，换了没意义（2026-10-24 起不随）"}
  CaravanTroll:   {silo: false, policy: keep, ui: false, note: "商队巨魔：跟着商队路线走，换了会断商队（2026-10-24 起不随）"}

# ── 类合并 ──────────────────────────────────────────────────────────────────
# 法魂新增、游戏里没有名字的杂兵（旧 Mob 类：统一名「法魂杂兵（cXXXX）」）并入 Basic：
# 它们本来就和普通杂兵同一档强度、同一类位置，单列一类只会把池拆小。
class_aliases:
  Mob: Basic

# ── L2：silo = 类 × 区域 ────────────────────────────────────────────────────
l2_silo:
  rule: "{class}|{area}"          # area ∈ base | dlc
  area_values: [base, dlc]
  # DLC 地图前缀（依据 diste/Names/MapName.txt 逐图名核对，2026-10-20）
  #   m61  = 幽影地大地图（Scaduview / Gravesite Plain / Cerulean Coast / Rauh …）
  #   m20  = 塔之镇贝鲁纳特 / 艾尼尔·伊利姆     m21 = 幽影城（含圣堂）
  #   m22  = 石棺裂隙                          m25 = 指头产房
  #   m28  = 米德拉宅邸                        m40-m43 = DLC 墓地/监牢/锻造遗迹/洞窟
  # ⚠️ m60 是**本体**大地图分块（Liurnia/Caelid/Mountaintops…），不是 DLC。
  dlc_map_prefixes: [m20, m21, m22, m25, m28, m40, m41, m42, m43, m61]
  note: "同 silo 内才可能互换；本体与 DLC 不混（DLC 敌人不会被扔进本体地图，反之亦然）"

# ── L3：强度档 ──────────────────────────────────────────────────────────────
l3_tier:
  # 复合分位：hp 权重 0.75、魂量权重 0.25（魂量大量为 0，权重给低）
  metric: "0.75*rank(log10(max(hp,1))) + 0.25*rank(log10(max(get_soul,1)))"
  scope: silo                 # 在 silo 内算分位 → tier 1..4 = 该 silo 内由弱到强
  cuts: [0.25, 0.50, 0.75]
  source: "investigation/enemy_table.csv（npc_id → row_id，命中 27,724/27,780 = 99.8%）"
  note: |
    tier 只用于"换同档 / 报告 / 界面显示"。真正的数值对齐按**位置原敌人的强度**缩放
    （docs/敌人随机_分类与平衡_设计v0.md §5），不靠 tier。

# ── L4：政策 ────────────────────────────────────────────────────────────────
l4_policy:
  values: [randomize, keep, source_only, hazard, story]
  # 按顺序求值，第一条命中即生效。**顺序必须与 enemy_data_build.apply_layer 一致**
  rules:
    - {when: "place in overrides.places",     policy: "见 overrides", reason: "人工覆盖"}
    - {when: "npc_id in never_touch_npc_ids", policy: keep, reason: "换了就永久失效（传送门本体物件）"}
    - {when: "place in multiphase.groups",    policy: keep, reason: "多阶段 Boss：换一阶段 = 半只 Boss"}
    - {when: "实体被 EMEVD 脚本绑定（evt 非空）", policy: keep, reason: "pair 坐骑/受击对、anim 强制动画、copy 外观复制、aiid 脚本 AI —— 换模型会崩游戏或让 AI 失效（232 行）"}
    - {when: "model == c0000",                policy: keep, reason: "占位空壳，真身由事件生成（约 390 行）"}
    - {when: "part 名含 Sound",               policy: keep, reason: "声音/演出占位，舞台上不战斗（6 行）"}
    - {when: "class.silo == false",           policy: keep, reason: "该类不参与随机"}
    - {when: "model in keep_models",          policy: keep, reason: "v1 人工判定不参与"}
    - {when: "map in keep_maps",              policy: keep, reason: "枢纽/安全区"}
    - {when: "npc_id in keep_npc_ids",        policy: keep, reason: "人工指定（见 note）"}
    - {when: "place in keep_places",          policy: keep, reason: "人工指定"}
    - {when: "hp 无数值",                     policy: keep, reason: "取不到数值 → 不碰"}
    - {else: randomize}
  keep_models:   # v1 不参与随机：8 个圆桌训练假人 + 弹丸假人 + 2 个闪电球变体（危害物）
    - c8003
    - c8004
    - c8005
    - c8006
    - c8007
    - c8008
    - c8009
    - c8099
    - c120
    - c2105
    - c2151
  keep_maps:
    - m11_10_00_00          # 圆桌厅堂（178 个位置：NPC、训练假人、剧情对象）
  keep_npc_ids:
    526100965: "希芙拉河诺克隆广场的拟态泪：换掉会破拟态机制"
  never_touch_npc_ids:
    506010050: "黄金树传送门本体（物件，不是敌人 part）；换它 = 传送门彻底失效"
  keep_places:
    # 蕾娜菈二阶段的法术分身：只负责放技能，不是可战斗对象，换模型会让她的招式变成别的怪
    - {map: m14_00_00_00, entity: 14000890, reason: "蕾娜菈二阶段法术分身（Comet Azur/Moon 等）"}
    - {map: m14_00_00_00, entity: 14000891, reason: "蕾娜菈二阶段法术分身（Comet Azur/Moon 等）"}
    # 指头之母尤弥尔：MSB 里是占位模型 c0000，真模型由事件挂 SpEffect 生成，换掉就崩
    - {map: m61_51_45_00, entity: 2051450720, reason: "占位模型 c0000，真身由事件生成"}
    # 劳弗圣龛竞技场：一个实体承载 9 个仪卫变体（用 spEffect 切换）——换掉 9 个变体全变一只、阶段二断链
    - {map: m31_81_00_00, entity: 31810800, reason: "9 个劳弗仪卫变体共用的竞技场实体"}
    # 拟态泪的可见壳（entity 12070810）：事件 12078850 里 X16 = 它，ForceAnimationPlayback(20010) 摆尸体造型、
    # 真身 X0=12070805 由 CopyPlayerCharacterData 复制玩家。换掉壳 = 玩家看到「蝙蝠尸体」，拟态本体不出现。
    - {map: m12_07_00_00, entity: 12070810, reason: "拟态泪可见壳（事件 X16 / ForceAnimationPlayback 20010），换掉后看到的是壳"}
    # 「梦之灾厄」哥拉斯（entity 12020850）：用户 2026-10-21 确认可随（Copy Slime 的复制只影响外观，
    # 换来的身份/数值/AI 仍然生效），所以不再 keep；同图 12020860 是它的尸体壳（npc 0，已按「取不到数值」keep）。

# ── 多阶段 Boss：一场战斗的两个阶段（位置一律 keep）──────────────────────────
# 只换其中一阶段 = 半只 Boss：血条名、换阶段事件、站位/无敌帧全都会错。
# 这些位置不动；v1.1 按参考实现的 NextPhase/Phases/RemoveGroup 支持整组替换（swap）。
# v1.3.14 起另加「当来源」：位置仍然 keep，但这些 Boss 的身份可以当别的位置的来源
#   （参考实现里每个阶段都是一个可分配 source，靠 NextPhase/Phases 做相位配对；
#    我们只搬运四元组身份，所以只要求身份本身可独立出战）。
# 判据与逐条证据：docs/敌人随机_M0_对齐报告.md §5.2（m17 那条已在 EMEVD 里核到换阶段指令）
multiphase:
  # kind： phase = 真阶段（换阶段事件按顺序绑）；helper = 血条/辅助实体；mount = 坐骑；dummy = HP 壳
  # sources：允许当「来源」的实体（v1.3.14；缺省 = phases）。个别组的真身不在 phases 里
  #   （如幽影树化身 800 是本体、810-812 是血条助手），显式列出；HP 壳/坐骑/帮忙实体不列。
  # swap： true = 允许 v1.1「整组替换」。只给**无 pair 绑定**的 5 组开；
  #        有 CreateReferredDamagePair 的 4 组（godfrey/maliketh/radahn/fire_giant）保持 false
  #        —— pair 是 2026-10-21 安塞尔河坏档的根因（骑手/坐骑互换后读档崩溃）。
  groups:
    - {id: godfrey_horah,       map: m11_05_00_00, phases: [11050800, 11050801], kind: phase, swap: false, sources: [11050800, 11050801]}  # 葛孚雷 → 荷莱·露（pair）
    - {id: maliketh_beast,      map: m13_00_00_00, phases: [13000801, 13000800], kind: phase, swap: false, sources: [13000801, 13000800]}  # 野兽祭司 → 玛利喀斯（pair）
    - {id: rennala,             map: m14_00_00_00, phases: [14000801, 14000800], kind: phase, swap: true, sources: [14000800, 14000801]}   # 蕾娜菈：一阶段 800 / 二阶段 801
    - {id: rykard_serpent,      map: m16_00_00_00, phases: [16000801, 16000800], kind: phase, swap: true, sources: [16000801, 16000800]}   # 噬神大蛇 801 → 拉卡德 800
    - {id: daergraf,            map: m17_00_00_00, phases: [17000800, 17000810], kind: phase, swap: true, sources: [17000800, 17000810]}   # 地底大法师 → 伪龙王
    - {id: radagon_eldenbeast,  map: m19_00_00_00, phases: [19000810, 19000800], kind: phase, swap: true, sources: [19000810, 19000800]}   # 拉达冈 810 → 艾尔登之兽 800
    - {id: radahn_consort,      map: m20_01_00_00, phases: [20010800, 20010801], kind: phase, swap: false, sources: [20010800, 20010801]}  # 拉塔恩 两阶段（pair）
    - {id: messmer,             map: m21_01_00_00, phases: [21010800, 21010801], kind: phase, swap: false, sources: [21010800, 21010801]}  # 梅瑟莫 两阶段（pair）
    - {id: malenia,             map: m15_00_00_00, phases: [15000800, 15000806], kind: phase, swap: true, sources: [15000800, 15000806]}   # 玛莲妮亚 → 腐败女神（15000806 注释 "Phase 2 Malenia"）
    - {id: godskin_scion,       map: m12_01_00_00, phases: [12010810, 12010812], kind: dummy, swap: false, sources: [12010812]}  # 12010812 真身，12010810 是 ScionHpDummy
    - {id: fire_giant,          map: m60_13_13_02, phases: [1052520800, 1052520801], kind: phase, swap: false, sources: [1052520800, 1052520801]}  # pair + 拆 NPCPart
    - {id: scadutree,           map: m61_50_48_00, phases: [2050480810, 2050480811, 2050480812], kind: helper, swap: false, sources: [2050480800]}  # 真身 800（evt:pair）；810-812 是三阶段血条助手
    - {id: putrescent,          map: m22_00_00_00, phases: [22000800, 22000801], kind: mount, swap: false, sources: [22000800]}   # 融泥骑士（800）；801 是坐骑
    - {id: midra,               map: m28_00_00_00, phases: [28000800, 28000801], kind: helper, swap: false, sources: [28000800]}  # 米德拉本体（800）；801 被三个事件共用

